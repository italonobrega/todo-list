<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <div class="card">

        <header class="card-header">
          <h1>Minhas Tarefas</h1>
          <span class="contador">0 pendentes</span>
        </header>

        <form class="form-tarefa" id="form-tarefa">
          <input
            type="text"
            id="input-tarefa"
            placeholder="Adicionar nova tarefa..."
            autocomplete="off"
          />
          <button type="submit" aria-label="Adicionar tarefa">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>

        <ul id="lista-tarefas">

          <!-- Exemplos visuais — serão removidos quando o JS entrar -->
          <li class="item-tarefa">
            <button class="btn-check" aria-label="Concluir tarefa">
              <i class="fa-regular fa-circle"></i>
            </button>
            <span class="texto-tarefa">Estudar JavaScript</span>
            <button class="btn-deletar" aria-label="Deletar tarefa">
              <i class="fa-solid fa-trash"></i>
            </button>
          </li>

          <li class="item-tarefa concluida">
            <button class="btn-check" aria-label="Reabrir tarefa">
              <i class="fa-solid fa-circle-check"></i>
            </button>
            <span class="texto-tarefa">Criar estrutura HTML</span>
            <button class="btn-deletar" aria-label="Deletar tarefa">
              <i class="fa-solid fa-trash"></i>
            </button>
          </li>

        </ul>

      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
